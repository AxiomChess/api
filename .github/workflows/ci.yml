name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: axiomchess_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d axiomchess_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/axiomchess_test
      API_KEY_PEPPER: ci-test-pepper
    steps:
      - name: Checkout api
        uses: actions/checkout@v4
        with:
          path: api
      - name: Checkout adapters
        uses: actions/checkout@v4
        with:
          repository: AxiomChess/adapters
          path: adapters
      - name: Checkout analyzer
        uses: actions/checkout@v4
        with:
          repository: AxiomChess/analyzer
          path: analyzer
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.3
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: api/pnpm-lock.yaml
      - name: Build adapters
        working-directory: adapters
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build analyzer
        working-directory: analyzer
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Install api
        working-directory: api
        run: pnpm install --frozen-lockfile
      - name: Secret pattern scan
        working-directory: api
        run: pnpm secrets:scan
      - name: Lint
        working-directory: api
        run: pnpm lint
      - name: Test
        working-directory: api
        run: pnpm test
      - name: Build
        working-directory: api
        run: pnpm build
      - name: Migrate
        working-directory: api
        run: pnpm migrate
